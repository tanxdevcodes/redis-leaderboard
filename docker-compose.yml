version: "3.8"

services:
  # -------------------------------------------------------------
  # Service 1: Redis Database
  # -------------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: redis_db
    ports:
      - "6379:6379"
    restart: always

  # -------------------------------------------------------------
  # Service 2: Express Node.js Backend API
  # -------------------------------------------------------------
  backend:
    build: ./backend
    container_name: express_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always

  # -------------------------------------------------------------
  # Service 3: React Vite Frontend UI
  # -------------------------------------------------------------
  frontend:
    build: ./frontend
    container_name: react_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    restart: always
